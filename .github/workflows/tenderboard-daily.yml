name: TenderFlow Daily Scraper

on:
  schedule:
    # GitHub's `schedule` trigger is not guaranteed to fire on time - on
    # this repo it has been observed firing anywhere from ~1 to ~12 hours
    # late. So instead of one "0 8 * * *" tick, this fires every 10 minutes
    # across 08:00-09:50 UTC (16:00-17:50 Singapore time) - whichever tick
    # actually gets through first does the real work; daily_report.py's
    # same-day marker file makes every later tick that day a fast no-op
    # (see _already_sent_today/_mark_sent_today).
    - cron: "*/10 8-9 * * *"
  workflow_dispatch:
    inputs:
      force_full_report:
        description: >-
          Report every tender currently on the board (not just ones new
          since the last run). Does not affect the dedupe database or the
          daily send-marker used by the schedule - use this to
          preview/verify the digest.
        type: boolean
        default: false

permissions:
  contents: read

# Ticks are 10 minutes apart but a run can take longer than that (scrape +
# classify + email). Serialize them so two ticks never scrape/send
# concurrently and race on the same-day marker file.
concurrency:
  group: tenderboard-daily
  cancel-in-progress: false

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scraper de-dupes new tenders against Lance/Tender/Excel
      # Sheets/Database.xlsx (gitignored, so it is not committed). Caching
      # it between runs is what makes "new since last run" mean anything
      # across days instead of re-reporting everything every run.
      - name: Restore tender database cache
        uses: actions/cache/restore@v4
        with:
          path: "Lance/Tender/Excel Sheets"
          key: tenderboard-database-${{ github.run_id }}
          restore-keys: |
            tenderboard-database-

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily tender scrape and email digest
        env:
          TENDERBOARD_USERNAME: ${{ secrets.TENDERBOARD_USERNAME }}
          TENDERBOARD_PASSWORD: ${{ secrets.TENDERBOARD_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          RECIPIENT_EMAILS_TEST: ${{ secrets.RECIPIENT_EMAILS_TEST }}
          FORCE_FULL_REPORT: ${{ inputs.force_full_report }}
        run: python "Lance/Tender/daily_report.py"

      # The cache below keeps the scraper's dedupe state between runs, but
      # caches cannot be downloaded from a workflow run. Publish the dated
      # Excel reports separately so they appear in the run's Artifacts list.
      - name: Upload tender Excel reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenderflow-report-${{ github.run_number }}
          path: "Lance/Tender/Excel Sheets/*_TenderBoard.xlsx"
          if-no-files-found: warn
          retention-days: 14

      - name: Save tender database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: "Lance/Tender/Excel Sheets"
          key: tenderboard-database-${{ github.run_id }}
